<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Site Under Maintenance</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Basic Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  color: #333;
}

.container {
  text-align: center;
  padding: 40px;
  background-color: #fff;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  width: 90%;
  max-width: 600px;
}

.heading {
  font-size: 2.5rem;
  color: #FF5722;
  margin-bottom: 20px;
}

.message {
  font-size: 1.2rem;
  color: #555;
  margin-bottom: 30px;
}

.contact-info {
  margin-bottom: 30px;
}

.contact-info a {
  text-decoration: none;
  color: #FF5722;
}

.social-links a {
  text-decoration: none;
  color: #333;
  margin: 0 15px;
  font-size: 1.1rem;
}

.social-links a:hover {
  color: #FF5722;
}

.social-links {
  margin-top: 20px;
}

@media (max-width: 480px) {
  .heading {
    font-size: 2rem;
  }

  .message {
    font-size: 1rem;
  }

  .social-links a {
    font-size: 1rem;
  }
}

  </style>
</head>
<body>

  <div class="container">
    <div class="content">
      <h1 class="heading">We'll Be Back Soon!</h1>
      <p class="message">Our site is currently undergoing some maintenance. Please check back later.</p>
      <div class="contact-info">
        <p>If you need to get in touch, feel free to <a href="mailto:your.email@example.com">email us</a>.</p>
      </div>
      <div class="social-links">
        <a href="https://github.com/Esmat-Farjad" target="_blank">GitHub</a>
        <a href="https://linkedin.com/in/esmatullah-hashimi-5b56401ba/" target="_blank">LinkedIn</a>
      </div>
    </div>
  </div>

</body>
</html>
